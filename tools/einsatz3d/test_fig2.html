<!doctype html><html><head><style>html,body{margin:0;background:#000}</style></head><body>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
<script type="module">
import { THREE, mat, bodenPlatte, betonTex } from './kern.js';
import { Figur, gehPose, hockPose, rennPose } from './figur.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1080, 1920); r.shadowMap.enabled = true;
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8090a0);
s.add(bodenPlatte(30, 30, mat(0x777777, { map: betonTex() })));
s.add(new THREE.HemisphereLight(0xdde6ff, 0x404040, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(3, 6, 4); sun.castShadow = true; s.add(sun);
const cam = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.05, 100);
const m = new URLSearchParams(location.search).get('m') ?? 'a';
const f = []; for (let i = 0; i < 3; i++) { const x = new Figur({ art: 'team', nummer: [1, 2, 4][i], helm: true, sturmhaube: true, maskeHoch: [0, .5, 1][i], headset: i === 0, groesse: [1.86, 1.98, 1.72][i] }); s.add(x.root); f.push(x); }
window.renderFrame = async (t) => {
  f[0].pose(rennPose(t * 6)); f[0].platziere(-.8, 0, .4); f[0].haltGewehr('tief');
  f[1].pose({ beinL: [1.5, 1.55], beinR: [1.42, 1.5], rumpf: [.08, 0, 0] }); f[1].platziere(0, -.3, 0, { hoehe: .5 - .98 * f[1].root.scale.x + .04 }); f[1].haltGewehr('hoch');
  f[2].pose(hockPose(.5)); f[2].platziere(.8, 0, -.4); f[2].haltGewehr('anschlag');
  if (m === 'a') { cam.position.set(0, 1.2, 4.2); cam.lookAt(0, .9, 0); } else { cam.position.set(0, 1.45, 2.0); cam.lookAt(0, 1.35, 0); }
  r.render(s, cam);
};
window.bereit = true;
</script></body></html>
